# Render service definition for smartparking backend
services:
  - type: web
    name: smartparking-backend
    env: docker
    plan: free
    repo: https://github.com/AninditaGarai/smartparking1
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    # IMPORTANT: Set these environment variables in the Render dashboard after import:
    # - MONGODB_URI: Your MongoDB connection string
    # - JWT_SECRET: A strong secret key for JWT
    # - PORT: 5000
